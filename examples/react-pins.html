<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React pins demo</title>
    <style>
      :root { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1f2328; color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #fff; }
      .page { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
      aside { overflow-y: auto; border-right: 1px solid rgba(31, 35, 40, 0.1); padding: 20px; }
      h1 { margin: 0 0 12px; font-size: 18px; }
      .filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
      .filters button { cursor: pointer; border: 1px solid rgba(31, 35, 40, 0.12); background: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 12px; }
      .filters button.on { background: #1f2328; color: #fff; border-color: #1f2328; }
      ul { list-style: none; margin: 0; padding: 0; }
      li { cursor: pointer; display: flex; flex-direction: column; padding: 10px 8px; border-radius: 8px; font-size: 14px; }
      li span { font-size: 12px; color: #6b7280; }
      li:hover, li.on { background: #eef6ff; }
      main { min-height: 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./react-pins.tsx"></script>
  </body>
</html>
